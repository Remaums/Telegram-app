<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="260" height="280" role="img" aria-label="Karton, la mascotte de la boutique">
  <defs>
    <clipPath id="headClip">
      <path d="M46,74 h168 a18,18 0 0 1 18,18 v96 a18,18 0 0 1 -18,18 H46 a18,18 0 0 1 -18,-18 V92 a18,18 0 0 1 18,-18 Z"/>
    </clipPath>
  </defs>

  <!-- fumée -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".75">
    <path d="M206,150 c16,-10 4,-26 18,-34 c12,-7 4,-20 14,-26"/>
    <path d="M190,178 c14,-6 8,-18 20,-22" opacity=".5"/>
  </g>

  <g stroke="#141414" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- corps -->
    <path d="M78,222 h104 a16,16 0 0 1 16,16 v34 H62 v-34 a16,16 0 0 1 16,-16 Z" fill="#57b558"/>
    <!-- tête / carton -->
    <path d="M46,74 h168 a18,18 0 0 1 18,18 v96 a18,18 0 0 1 -18,18 H46 a18,18 0 0 1 -18,-18 V92 a18,18 0 0 1 18,-18 Z" fill="#d7a86a"/>
    <!-- rabats du dessus -->
    <path d="M38,74 l40,-30 h48 l-34,30 Z" fill="#c9974f"/>
    <path d="M222,74 l-40,-30 h-48 l34,30 Z" fill="#e0b884"/>
  </g>

  <g clip-path="url(#headClip)">
    <!-- bande de scotch -->
    <rect x="20" y="96" width="220" height="20" fill="#f2d9a8" opacity=".85"/>
    <path d="M20,96 h220 M20,116 h220" stroke="#b98d4e" stroke-width="3"/>
    <!-- cannelures du carton -->
    <g stroke="#b98d4e" stroke-width="3" opacity=".35">
      <path d="M28,196 h204"/><path d="M28,204 h204"/>
    </g>
  </g>

  <!-- yeux mi-clos -->
  <g stroke="#141414" stroke-width="8" stroke-linecap="round">
    <circle cx="98" cy="150" r="24" fill="#fff"/>
    <circle cx="166" cy="150" r="24" fill="#fff"/>
    <circle cx="102" cy="156" r="9" fill="#141414" stroke="none"/>
    <circle cx="170" cy="156" r="9" fill="#141414" stroke="none"/>
    <path d="M76,140 c10,-8 34,-8 44,2" fill="#d7a86a"/>
    <path d="M144,140 c10,-8 34,-8 44,2" fill="#d7a86a"/>
    <!-- rougeurs -->
    <ellipse cx="70" cy="176" rx="14" ry="8" fill="#e8735f" opacity=".5" stroke="none"/>
    <ellipse cx="194" cy="176" rx="14" ry="8" fill="#e8735f" opacity=".5" stroke="none"/>
  </g>

  <!-- sourire + joint -->
  <g stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104,186 c14,14 40,14 54,0" fill="none"/>
    <rect x="160" y="176" width="46" height="13" rx="6" fill="#f6f0e2" transform="rotate(-16 160 176)"/>
    <circle cx="206" cy="164" r="6" fill="#e8734a" stroke-width="6"/>
  </g>

  <!-- sticker feuille sur le carton -->
  <g transform="translate(60 118) scale(.42)" stroke="#141414" stroke-width="16" stroke-linejoin="round">
    <path d="M0,10 c-14,-22 -26,-44 -16,-64 l10,16 l0,-30 l6,-22 l6,22 l0,30 l10,-16 c10,20 -2,42 -16,64 Z" fill="#3f9142"/>
  </g>
</svg>
